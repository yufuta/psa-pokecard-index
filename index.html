<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>ポケカ相場指数｜PSA10の価格推移を毎日更新 - PSAポケカ指数</title>
<meta name="description" content="旧裏からサン＆ムーンまで、ポケモンカード(PSA10)の相場を指数とグラフで毎日更新。シリーズ別・カード別・イラストレーター別に見られます。">

<style>
:root{
  --c-base:#8CD0DC;--c-base-deep:#1D6F80;--c-base-pale:#E4F4F7;--c-bg:#FFF9F0;--c-surface:#FFFFFF;
  --c-cta:#FFD25E;--c-cta-shadow:#E3B23C;--c-pink:#F7B9C4;--c-ink:#3B3A45;--c-ink-sub:#6B6F7A;--c-line:#D5ECF0;
  --c-up:#17734F;--c-up-bg:#E3F4EA;--c-up-line:#2E9E6E;--c-down:#C2413A;--c-down-bg:#FDE8E6;--c-down-line:#E0685F;
  --c-flat:#6B6F7A;--c-flat-bg:#EEF0F2;--c-flat-line:#A3AAB3;--c-warn:#FFF1C7;--c-warn-ink:#7A5A00;--c-foot:#F3EBDD;
  --r-s:8px;--r-m:14px;--r-l:20px;--r-pill:999px;
  --sh-sticker:0 3px 0 #D5ECF0,0 6px 16px rgba(59,58,69,.06);--sh-hover:0 5px 0 #BFE3EA,0 10px 24px rgba(59,58,69,.10);
  --border:2px solid #E4F4F7;
  --font:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  --font-num:"SF Pro Rounded","Hiragino Maru Gothic ProN","BIZ UDPGothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--c-bg);color:var(--c-ink);font:16px/1.75 var(--font);letter-spacing:.02em}
a{color:var(--c-base-deep);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:transparent}
a:hover{text-decoration-color:var(--c-base)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--c-base-deep);outline-offset:3px;border-radius:6px}
.num,.big,.chg,td.r{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
@media(min-width:900px){.wrap{padding:0 24px}}
/* header + footer */
header{background:var(--c-base);position:relative}
header .wrap{display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:8px 16px;flex-wrap:wrap;padding-block:6px}
.logo{font-size:20px;font-weight:800;color:var(--c-ink);text-decoration:none}
.logo .badge{display:inline-block;margin-left:8px;padding:0 10px;background:#fff;border-radius:var(--r-pill);font-size:10px;font-weight:700;vertical-align:middle;color:var(--c-base-deep)}
nav{display:flex;align-items:center;flex-wrap:wrap;gap:4px 18px}
nav a{color:var(--c-ink);font-size:14px;font-weight:700;text-decoration:none;padding:6px 2px}
nav a:hover{text-decoration:underline;text-decoration-color:#fff}
header::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;background:radial-gradient(circle at 10px 0,var(--c-base) 10px,transparent 10.5px) 0 0/20px 10px repeat-x}
.banner{background:transparent;color:var(--c-ink-sub);font-size:12px;padding:16px 0 0;text-align:center}
main{padding:12px 0 56px;min-height:60vh}
footer{background:var(--c-foot);position:relative;margin-top:40px;padding:48px 0 32px;color:#5b5648;font-size:13px}
footer::before{content:"";position:absolute;left:0;right:0;top:-9px;height:10px;background:radial-gradient(circle at 10px 10px,var(--c-foot) 10px,transparent 10.5px) 0 0/20px 10px repeat-x}
footer a{color:#4a4538}
.fcols{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:20px}.fcols ul.two{display:block;columns:2}
.fcols h3{font-size:14px;margin:0 0 6px}.fcols ul{list-style:none;margin:0;padding:0}.fcols li{margin:2px 0}
/* headings */
h1{font-size:26px;line-height:1.4;margin:6px 0 14px;font-weight:700}
h1::after{content:"";display:block;width:48px;height:6px;border-radius:var(--r-pill);background:var(--c-base);margin-top:8px}
@media(min-width:900px){h1{font-size:32px}}
h2{margin:40px 0 14px;font-size:18px}
h2.ribbon,.ribbon{display:inline-flex;align-items:center;gap:8px;padding:6px 18px 6px 14px;background:var(--c-base-pale);border-radius:var(--r-pill);font-size:18px;font-weight:700}
.ribbon::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c-pink)}
h3{font-size:16px;margin:0 0 4px}
.crumb{font-size:13px;color:var(--c-ink-sub);margin:10px 0 4px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.crumb a{color:var(--c-ink-sub)}
.crumb span.sep{margin:0 6px}
.meta{font-size:12px;color:var(--c-ink-sub)}
.dots{border:0;border-top:3px dotted var(--c-line);margin:32px 0}
/* panels */
.panel{background:var(--c-surface);border:var(--border);border-radius:var(--r-l);padding:20px;box-shadow:var(--sh-sticker);overflow-x:auto}
@media(min-width:900px){.panel{padding:28px}}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.two{display:grid;gap:20px;grid-template-columns:1fr 1fr}
@media(max-width:720px){.two{grid-template-columns:1fr}}
.hero{display:flex;flex-wrap:wrap;gap:20px;align-items:baseline;margin-bottom:8px}
.big{font-size:38px;font-weight:800;line-height:1.2}
.chg{font-size:18px;font-weight:700}
.up{color:var(--c-up)}.down{color:var(--c-down)}.flat{color:var(--c-flat)}
.empty{background:var(--c-base-pale);color:var(--c-ink-sub);border-radius:var(--r-m);padding:18px;font-size:14px;text-align:center}
.pill{display:inline-block;background:var(--c-warn);color:var(--c-warn-ink);border-radius:var(--r-pill);padding:1px 10px;font-size:12px;margin:2px 4px 2px 0}
.note{background:var(--c-warn);color:var(--c-warn-ink);border-radius:var(--r-m);padding:10px 14px;font-size:13px;margin-top:12px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--c-base-pale);border-radius:6px;padding:1px 6px;font-size:13px}
ul.plain{padding-left:20px;margin:6px 0}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:12px}
.steps>li{counter-increment:s;background:var(--c-surface);border:var(--border);border-radius:var(--r-m);padding:14px 16px 14px 56px;position:relative}
.steps>li::before{content:counter(s);position:absolute;left:14px;top:14px;width:28px;height:28px;border-radius:50%;background:var(--c-cta);color:var(--c-ink);font-weight:800;display:grid;place-items:center}
/* buttons, chips, segments */
.btn{display:inline-block;border:2px solid var(--c-base);background:#fff;color:var(--c-base-deep);border-radius:var(--r-pill);padding:8px 20px;font-size:14px;font-weight:700;text-decoration:none;box-shadow:0 3px 0 #D5ECF0;cursor:pointer}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 #BFE3EA}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #D5ECF0}
.btn.primary{background:var(--c-cta);border-color:var(--c-cta);color:var(--c-ink);box-shadow:0 3px 0 var(--c-cta-shadow)}
.seg{display:inline-flex;background:var(--c-base-pale);border-radius:var(--r-pill);padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--c-ink);border-radius:var(--r-pill);padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;min-height:36px}
.seg button.on{background:#fff;font-weight:800;box-shadow:0 2px 0 #BFE3EA}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
@media(min-width:600px){.chips{display:flex;flex-wrap:wrap}}
.chip{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--r-m);padding:6px 14px;font-size:13px;font-weight:700;text-align:center;line-height:1.35}
@media(min-width:600px){.chip{flex-direction:row;gap:8px;border-radius:var(--r-pill);min-height:32px;padding:4px 14px}}
.chip.up{background:var(--c-up-bg);color:var(--c-up)}.chip.down{background:var(--c-down-bg);color:var(--c-down)}.chip.flat{background:var(--c-flat-bg);color:var(--c-flat)}
.chip small{font-weight:400;opacity:.85}
details.more{margin-top:14px;border-top:3px dotted var(--c-line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:700;color:var(--c-base-deep);font-size:14px}
/* chart */
.cbox{position:relative;margin-top:8px}
.cbox svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tipband{min-height:26px;font-size:13px;font-weight:700;color:var(--c-ink);background:var(--c-base-pale);border-radius:var(--r-s);padding:3px 10px;margin-bottom:6px}
.headline{font-size:20px;font-weight:700;line-height:1.5;margin:4px 0 2px}
@media(min-width:900px){.headline{font-size:24px}}
/* tiles */
.card-grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:600px){.card-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media(min-width:900px){.card-grid{grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:20px}}
.tile{position:relative;display:flex;flex-direction:column;background:var(--c-surface);border:var(--border);border-radius:var(--r-l);padding:10px;box-shadow:var(--sh-sticker);transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0}
@media(min-width:900px){.tile{padding:12px}}
.tile.refc{border:2px dashed #E3D6C2}
.tile-img{position:relative;aspect-ratio:1/1.2;background:#F2FAFB;border-radius:var(--r-m);display:grid;place-items:center;overflow:hidden}
.tile-img img{height:92%;width:auto;max-width:92%;object-fit:contain}
.ph{width:62%;aspect-ratio:63/88;border:2px dashed #BFE3EA;border-radius:8px;background:repeating-linear-gradient(45deg,#F2FAFB 0 8px,#E4F4F7 8px 16px);display:grid;place-items:center;text-align:center;font-size:11px;color:var(--c-ink-sub);padding:4px;line-height:1.3}
.tile .badges{position:absolute;left:6px;top:6px;display:flex;gap:4px;flex-wrap:wrap}
.bdg{font-size:10px;font-weight:700;border-radius:var(--r-pill);padding:1px 8px;background:var(--c-flat-bg);color:#4d5560}
.bdg.ref{background:var(--c-foot);color:#6B5E4A}.bdg.first{background:var(--c-warn);color:var(--c-warn-ink)}
.tile-name{font-size:14px;font-weight:700;line-height:1.4;margin:10px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile-name a{color:var(--c-ink);text-decoration:none}
.tile-name a::after{content:"";position:absolute;inset:0;border-radius:var(--r-l)}
.tile-sub{font-size:12px;color:var(--c-ink-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-price{font-size:18px;font-weight:800;margin-top:6px;line-height:1.3}
@media(min-width:900px){.tile-price{font-size:20px}}
.tile-price small{display:block;font-size:12px;font-weight:400;color:var(--c-ink-sub)}
.tile-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px;min-height:26px}
.mini{display:inline-block;border-radius:var(--r-pill);padding:1px 8px;font-size:11px;font-weight:800}
.mini.up{background:var(--c-up-bg);color:var(--c-up)}.mini.down{background:var(--c-down-bg);color:var(--c-down)}.mini.flat{background:var(--c-flat-bg);color:var(--c-flat)}
.tile-illus{position:relative;z-index:1;font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-hover);border-color:var(--c-base)}
.tile:has(.tile-name a:focus-visible){outline:3px solid var(--c-base-deep);outline-offset:3px}
.tile:active{transform:translateY(1px);box-shadow:0 1px 0 #D5ECF0}
@media(prefers-reduced-motion:reduce){.tile,.btn{transition:none}.tile:hover,.btn:hover{transform:none}html{scroll-behavior:auto}}
.cat{display:block;color:var(--c-ink);text-decoration:none;padding:16px 18px}
.cat:hover{border-color:var(--c-base);transform:translateY(-2px);box-shadow:var(--sh-hover)}
.cat .n{font-weight:800;font-size:17px}
.cat .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:10px}
/* az illustrator index */
.az{display:grid;grid-template-columns:44px 1fr;gap:8px 12px;align-items:start}
.az .l{width:36px;height:36px;border-radius:50%;background:var(--c-base);color:var(--c-ink);font-weight:800;display:grid;place-items:center;font-size:16px}
.az .names{display:flex;flex-wrap:wrap;gap:6px 8px;padding:4px 0 10px;border-bottom:2px dotted var(--c-line)}
.chipl{display:inline-block;padding:2px 12px;border:2px solid var(--c-base-pale);background:#fff;border-radius:var(--r-pill);font-size:14px;text-decoration:none;color:var(--c-ink)}
.chipl:hover{border-color:var(--c-base);transform:scale(1.04)}
.chipl small{color:var(--c-ink-sub);margin-left:4px}
/* card page */
.cardhead{display:flex;gap:16px;align-items:flex-start;margin-bottom:6px}
.cimg{border-radius:8px;object-fit:cover;background:var(--c-base-pale);flex:none;width:132px;height:185px}
.cbadge{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:132px;height:185px;border:2px dashed #BFE3EA;border-radius:8px;background:#F2FAFB;flex:none}
.cbadge b{font-size:24px}.cbadge i{font-size:13px;font-style:normal;color:var(--c-ink-sub)}
.yen{color:var(--c-ink-sub);font-size:.88em}
.info{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--c-ink-sub);color:var(--c-ink-sub);background:none;font:italic 700 10px/1 serif;cursor:pointer;margin-left:4px;padding:0;vertical-align:middle}
.pop{position:fixed;z-index:50;max-width:250px;background:var(--c-ink);color:#fff;border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.6;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.pop[hidden]{display:none}
.ebaybox{background:#fff;border:2px solid #E6E6E6;border-radius:8px;padding:14px;margin-top:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--c-line);text-align:left}
th{font-size:12px;color:var(--c-ink-sub);font-weight:700}td.r,th.r{text-align:right}
.related{display:grid;gap:14px}
.flinks{display:flex;flex-wrap:wrap;gap:6px 18px}
.cta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.softhero{position:relative;overflow:hidden;border-radius:var(--r-l);padding:20px 4px 4px}
.softhero::before{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:#E4F4F7;opacity:.7;z-index:-1}
.softhero::after{content:"";position:absolute;left:-30px;bottom:-50px;width:140px;height:140px;border-radius:50%;background:#FDEFF2;opacity:.8;z-index:-1}
/* back to top */
#totop{position:fixed;right:16px;bottom:20px;width:48px;height:48px;border-radius:50%;border:0;background:var(--c-cta);color:var(--c-ink);font-size:20px;font-weight:800;box-shadow:0 3px 0 var(--c-cta-shadow),0 6px 16px rgba(59,58,69,.18);cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s;z-index:40}
#totop.show{opacity:1;pointer-events:auto;transform:none}
#totop:active{transform:translateY(2px)}
.skel{background:linear-gradient(90deg,#E4F4F7,#F2FAFB,#E4F4F7);background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:var(--r-m);min-height:80px}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}#totop{transition:none}}
.sr{position:absolute;left:-9999px}
</style>

<body>
<header><div class="wrap">
  <a class="logo" href="/" data-home>PSAポケカ指数<span class="badge">毎日更新</span></a>
  <nav aria-label="メイン"><a href="/" data-nav="series">シリーズ</a><a href="/" data-nav="illust">イラストレーター</a><a href="/" data-nav="guide">つかいかた</a></nav>
</div></header>
<div class="banner" id="banner">試験運用中 — 価格は、eBay の出品情報をもとに、毎日1回算出しています。</div>
<main><div class="wrap" id="app"><!--SSR--></div></main>
<footer><div class="wrap" id="foot"></div></footer>
<button id="totop" type="button" aria-label="ページの先頭へ戻る">↑</button>
<script src="data/latest.js"></script>
<script>
const GA_ID = 'G-6X43R1P4MT';
const EPN_CAMPID = '5339221531';   // eBay Partner Network campaign ID (affiliate links are off while empty)
const D = window.PSA_DATA;
const SERVER = !!window.PSA_SERVER;     // the server version has real URLs; the static version keeps hash URLs
const SITE_NAME = 'PSAポケカ指数';
const IMG = p => p ? (SERVER ? '/'+p : p) : p;
if(GA_ID){const g=document.createElement('script');g.async=true;g.src='https://www.googletagmanager.com/gtag/js?id='+GA_ID;document.head.appendChild(g);
  window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};gtag('js',new Date());gtag('config',GA_ID,{send_page_view:false});}
const track=(name,params)=>{if(GA_ID&&window.gtag)gtag('event',name,params)};
const state = {range:90, metric:'index', cm:null, sort:'price', shown:60};
const el = id => document.getElementById(id);
const esc = t => String(t==null?'':t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
// ---------- urls ----------
const SLUG={'sr-kyuura':'kyuura','sr-e':'card-e','sr-adv':'adv','sr-pcg':'pcg','sr-dp':'dp','sr-dpt':'dpt','sr-legend':'legend','sr-bw':'bw','sr-xy':'xy','sr-sm':'sm','ref':'reference'};
const slugOf=id=>SLUG[id]||id;
const idOfSlug=s=>Object.keys(SLUG).find(k=>SLUG[k]===s)||s;
const nslug=n=>String(n).normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const P={
  top:()=>SERVER?'/':'#/', seriesIndex:()=>SERVER?'/series/':'#/',
  series:id=>SERVER?`/series/${slugOf(id)}/`:`#/category/${id}`,
  card:id=>SERVER?`/cards/${id}/`:`#/card/${id}`,
  illust:n=>SERVER?`/illustrators/${nslug(n)}/`:`#/illust/${encodeURIComponent(n)}`,
  illustIndex:()=>SERVER?'/illustrators/':'#/illustrators',
  guide:()=>SERVER?'/guide/':'#/guide', about:()=>SERVER?'/about/':'#/about', privacy:()=>SERVER?'/privacy/':'#/privacy',
  terms:()=>SERVER?'/terms/':'#/terms', source:()=>SERVER?'/source/':'#/source',
};
const ABS=p=>(window.PSA_ORIGIN||location.origin)+(SERVER?p:'/'+p.replace(/^#\/?/,''));
function parseRoute(){
  if(SERVER){
    const seg=location.pathname.split('/').filter(Boolean);
    if(!seg.length)return{page:'top'};
    if(seg[0]==='series')return seg[1]?{page:'series',id:idOfSlug(seg[1])}:{page:'top',anchor:'series'};
    if(seg[0]==='cards'&&seg[1])return{page:'card',id:seg[1]};
    if(seg[0]==='illustrators')return seg[1]?{page:'illust',slug:seg[1]}:{page:'illustIndex'};
    if(['guide','about','privacy','terms','source'].includes(seg[0]))return{page:seg[0]};
    return{page:'notfound'};
  }
  const h=location.hash.replace(/^#\/?/,'').split('/');
  if(!h[0])return{page:'top'};
  if(h[0]==='category')return{page:'series',id:h[1]};
  if(h[0]==='card')return{page:'card',id:h[1]};
  if(h[0]==='illust')return{page:'illust',name:decodeURIComponent(h[1]||'')};
  if(h[0]==='illustrators')return{page:'illustIndex'};
  if(['guide','about','privacy','terms','source'].includes(h[0]))return{page:h[0]};
  return{page:'notfound'};
}
// ---------- helpers ----------
const usd = v => v==null?'—':'$'+v.toLocaleString('en-US',{maximumFractionDigits:2});
const jpy = v => v==null?'—':'¥'+Math.round(v*D.usd_jpy).toLocaleString('ja-JP');

const FXNAME={ecb:'欧州中央銀行(ECB)参照レート',frankfurter:'欧州中央銀行(ECB)参照レート',carried_forward:'前回取得したレート(ECB)',mock:'テスト用レート'};

function relatedCards(id,c){
  const same=Object.keys(D.cards).filter(k=>k!==id&&D.cards[k].set===c.set&&!D.cards[k].dup_of);
  const num=k=>parseInt(String(D.cards[k].number).split('/')[0],10)||0,mine=num(id);
  const near=same.filter(k=>num(k)).sort((a,b)=>Math.abs(num(a)-mine)-Math.abs(num(b)-mine)).slice(0,6);
  const names=illusNames(c);
  let byIllus=[];
  if(names[0])byIllus=Object.keys(D.cards).filter(k=>k!==id&&illusNames(D.cards[k]).includes(names[0])&&!D.cards[k].dup_of).sort((a,b)=>(D.cards[b].price_usd||0)-(D.cards[a].price_usd||0)).slice(0,6);
  const b=D.baskets.find(x=>x.card_ids.includes(id)&&x.id.startsWith('sr-'))||D.baskets.find(x=>x.card_ids.includes(id)&&!['all','total','ref'].includes(x.id));
  let risers=[];
  if(b)risers=moverCols(b.card_ids.filter(k=>k!==id&&D.cards[k]),6).up;
  return{near,byIllus,names,b,risers};
}

totop.addEventListener('click',()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'}));
// header links (real URLs in the server version)
document.querySelectorAll('header a[data-home]').forEach(a=>a.setAttribute('href',P.top()));
document.querySelector('header a[data-nav="series"]').setAttribute('href',P.top()+(SERVER?'#series':''));
document.querySelector('header a[data-nav="illust"]').setAttribute('href',P.illustIndex());
document.querySelector('header a[data-nav="guide"]').setAttribute('href',P.guide());
document.querySelector('header a[data-nav="illust"]').removeAttribute('data-nav');
// old hash URLs (links shared before the server version) -> real URLs
if(SERVER&&location.hash.startsWith('#/')){
  const h=location.hash.slice(2).split('/');let to=null;
  if(h[0]==='card'&&h[1])to=P.card(h[1]);else if(h[0]==='category'&&h[1])to=P.series(h[1]);else if(h[0]==='illust'&&h[1])to=P.illust(decodeURIComponent(h[1]));else if(['guide','about','privacy','terms','source'].includes(h[0]))to=P[h[0]]();
  if(to)history.replaceState(null,'',to);
}
render();
</script>
</body>
</html>
