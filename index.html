.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.cat{display:block;color:var(--ink)}.cat:hover{text-decoration:none;border-color:var(--accent)}
.cat .n{font-weight:600}
.two{display:grid;gap:16px;grid-template-columns:1fr 1fr}

.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chartbox{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:3px 8px;border-radius:6px;display:none;white-space:nowrap}
footer{color:var(--sub);font-size:12px;padding:24px 0;border-top:1px solid var(--line)}

  dates.forEach((d,i)=>{
    w+=gauss(R)*0.008;
    const n=Math.max(0,Math.round(c.vol+gauss(R)*1.2));
    for(let k=0;k<n;k++){
      let p=c.base*Math.exp(catWalk[c.cat][i]+w+gauss(R)*0.06);
      if(R()<0.03)p*=R()<0.5?1.6:0.6;            // 外れ値
      c.trades.push({di:i,date:fmtDate(d),usd:Math.round(p*100)/100});
    }
  });
});

// ---------- 指数計算 ----------
const median = a => {const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
function robustMedian(a){
  const m=median(a),mad=median(a.map(x=>Math.abs(x-m)))*1.4826;
  const kept=mad>0?a.filter(x=>Math.abs(x-m)<=3*mad):a;
  return median(kept.length?kept:a);
}
CARDS.forEach(c=>{
  c.price=[];c.n7=[];let last=c.base;
  for(let i=0;i<DAYS;i++){
    const w=c.trades.filter(t=>t.di>i-7&&t.di<=i);
    c.n7.push(w.length);
    if(w.length>=2)last=robustMedian(w.map(t=>t.usd));else if(w.length===1)last=w[0].usd;
    c.price.push(last);
  }
});
const ema=(a,al=0.5)=>{const o=[a[0]];for(let i=1;i<a.length;i++)o.push(al*a[i]+(1-al)*o[i-1]);return o};
function geoIndex(cards){ // 等ウェイト幾何平均(Jevons型)
  return dates.map((_,i)=>100*Math.exp(cards.reduce((s,c)=>s+Math.log(c.price[i]/c.price[0]),0)/cards.length));
}
function laspeyres(cards){ // 基準日価格ウェイト
  const tot=cards.reduce((s,c)=>s+c.price[0],0);
  return dates.map((_,i)=>100*cards.reduce((s,c)=>s+c.price[0]*(c.price[i]/c.price[0]),0)/tot);
}
CARDS.forEach(c=>{c.idxRaw=c.price.map(p=>100*p/c.price[0]);c.idx=ema(c.idxRaw)});
CATS.forEach(c=>{c.cards=CARDS.filter(x=>x.cat===c.id);c.raw=geoIndex(c.cards);c.idx=ema(c.raw)});
const ALL={raw:laspeyres(CARDS)};ALL.idx=ema(ALL.raw);

// ---------- ユーティリティ ----------
const last = a => a[a.length-1];
const pct = (a,i=a.length-1) => (a[i]/a[i-1]-1)*100;
const fmtPct = v => `${v>=0?'+':''}${v.toFixed(2)}%`;
const cls = v => v>=0?'up':'down';
const usd = v => '$'+v.toLocaleString('en-US',{maximumFractionDigits:2});
const jpy = v => '¥'+Math.round(v*JPY).toLocaleString('ja-JP');
const ebayUrl = c => 'https://www.ebay.com/sch/i.html?_nkw='+encodeURIComponent(c.q)+'&LH_Sold=1&LH_Complete=1';

function chart({series,labels,fmt=v=>v.toFixed(2)}){ // series:[{data,color,w}]
  const W=720,H=240,P={l:44,r:10,t:10,b:22};
  const all=series.flatMap(s=>s.data),mn=Math.min(...all),mx=Math.max(...all),pad=(mx-mn)*0.08||1;
  const lo=mn-pad,hi=mx+pad,n=series[0].data.length;
  const X=i=>P.l+(W-P.l-P.r)*i/(n-1),Y=v=>P.t+(H-P.t-P.b)*(1-(v-lo)/(hi-lo));
  let g='';
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,y=Y(v);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P.l-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--sub)">${fmt(v)}</text>`}
  [0,.25,.5,.75,1].forEach(f=>{const i=Math.round((n-1)*f);g+=`<text x="${X(i)}" y="${H-5}" text-anchor="${f===0?'start':f===1?'end':'middle'}" font-size="11" fill="var(--sub)">${labels[i].slice(5)}</text>`});
  const lines=series.map(s=>`<polyline fill="none" stroke="${s.color}" stroke-width="${s.w||2}" stroke-linejoin="round" points="${s.data.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/>`).join('');
  const id='c'+Math.random().toString(36).slice(2,8);
  setTimeout(()=>{const el=document.getElementById(id);if(!el)return;const svg=el.querySelector('svg'),tip=el.querySelector('.tip');
    svg.addEventListener('mousemove',e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;const i=Math.max(0,Math.min(n-1,Math.round((x-P.l)/(W-P.l-P.r)*(n-1))));const s=series[series.length-1];
      tip.style.display='block';tip.style.left=(X(i)/W*r.width+8)+'px';tip.style.top='6px';tip.textContent=`${labels[i]}  ${fmt(s.data[i])}`});
    svg.addEventListener('mouseleave',()=>tip.style.display='none')},0);
  return `<div class="chartbox" id="${id}"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="推移グラフ">${g}${lines}</svg><div class="tip"></div></div>`;
}
function spark(data,w=120,h=32){
  const mn=Math.min(...data),mx=Math.max(...data),X=i=>w*i/(data.length-1),Y=v=>h-2-(h-4)*(v-mn)/((mx-mn)||1);
  const c=last(data)>=data[0]?'var(--up)':'var(--down)';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${c}" stroke-width="1.6" points="${data.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/></svg>`;
}
function rangeTabs(key){return `<div class="tabs" style="margin:6px 0 8px">${[30,90,120].map(d=>`<button data-r="${d}" class="${state.range===d?'on':''}">${d}日</button>`).join('')}</div>`}
const state={range:90};
function slice(a){return a.slice(-state.range)}
function sliceL(){return dates.map(fmtDate).slice(-state.range)}
function rebase(a){const s=slice(a);return s.map(v=>v/s[0]*100)}

function indexBlock(title,obj,note){
  const v=last(obj.idx),ch=pct(obj.idx);
  return `<div class="panel">
    <div class="hero"><div><div class="meta">${title}</div><div class="big">${v.toFixed(2)}</div></div>
      <div><div class="meta">前日比</div><div class="chg ${cls(ch)}">${fmtPct(ch)}</div></div>
      <div><div class="meta">7日前比</div><div class="chg ${cls(v/obj.idx[obj.idx.length-8]-1)}">${fmtPct((v/obj.idx[obj.idx.length-8]-1)*100)}</div></div></div>
    <div class="meta">${note||''}</div>
    ${rangeTabs()}
    ${chart({series:[{data:rebase(obj.raw),color:'var(--raw)',w:1.2},{data:rebase(obj.idx),color:'var(--accent)',w:2.4}],labels:sliceL()})}
    <div class="meta"><span style="color:var(--accent)">━</span> 公表値(平滑化後) <span style="color:var(--raw)">━</span> 平滑化前 ・ 基準日 = 100(表示期間の初日に再基準化)</div>
  </div>`;
}
function rankTable(rows){
  return `<table><thead><tr><th>カード</th><th class="r">価格</th><th class="r">前日比</th></tr></thead><tbody>${rows.map(c=>{const ch=pct(c.idx);
    return `<tr><td><a href="#/card/${c.id}">${c.name}</a></td><td class="r">${usd(last(c.price))}</td><td class="r ${cls(ch)}">${fmtPct(ch)}</td></tr>`}).join('')}</tbody></table>`;
}
function cardTable(cards){
  return `<table><thead><tr><th>カード</th><th class="r">PSA10相場</th><th class="r">前日比</th><th class="r">推移</th></tr></thead><tbody>${cards.map(c=>{const ch=pct(c.idx);
    return `<tr><td><a href="#/card/${c.id}">${c.name}</a></td><td class="r">${usd(last(c.price))} <span class="meta">(${jpy(last(c.price))})</span></td><td class="r ${cls(ch)}">${fmtPct(ch)}</td><td class="r">${spark(c.idx.slice(-30),90,24)}</td></tr>`}).join('')}</tbody></table>`;
}

function pageTop(){
  const elig=CARDS.filter(c=>last(c.n7)>=MIN_TRADES_7D);
  const sorted=[...elig].sort((a,b)=>pct(b.idx)-pct(a.idx));

  <div class="meta" style="margin-bottom:12px">更新: ${fmtDate(last(dates))} ／ eBay 落札価格ベース ／ 対象 ${CARDS.length} 銘柄</div>
  ${indexBlock('総合指数',ALL,'基準日価格ウェイトの総合指数。直近7日の落札価格の中央値を元に算出し、EMAで平滑化。')}
  <h2>カテゴリ</h2>
  <div class="grid">${CATS.map(c=>{const ch=pct(c.idx);return `<a class="panel cat" href="#/category/${c.id}">

  ${ebayCta()}`;
}
function ebayCta(){return `<h2>eBay で実際の取引を確認する</h2><div class="panel cta"><div>本サイトの指数は eBay の実取引価格が元になっています。各カードのページから、eBay の落札・出品ページへ直接移動できます。</div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="#/guide">日本からの買い方ガイド</a><a class="btn" href="https://www.ebay.com/" target="_blank" rel="noopener">eBay を開く ↗</a></div></div>`}
function pageCat(id){

  ${t.map(x=>`<tr><td>${x.date}</td><td class="r">${usd(x.usd)}</td><td class="r">${jpy(x.usd)}</td><td><a href="${ebayUrl(c)}" target="_blank" rel="noopener">eBayで見る ↗</a></td></tr>`).join('')}
  </tbody></table><div class="meta" style="margin-top:8px">※ プロトタイプのため取引はダミーです。正式版では各取引の eBay 商品ページ URL を表示します。</div></div>`;

function pageAbout(){
  return `<h1>指数の算出方法</h1><div class="panel">
  <h2 style="margin-top:0">1. カード単位の価格</h2><ul class="plain"><li>対象は「カード × PSA 10」。</li><li>直近7日の落札価格の<strong>中央値</strong>を日次の相場とする。</li><li>MAD(中央値絶対偏差)による外れ値除外。取引が無い日は前日値を持ち越す。</li></ul>
  <h2>2. 集計</h2><ul class="plain"><li>カテゴリ指数: 価格比の<strong>等ウェイト幾何平均</strong>(Jevons型)。</li><li>総合指数: 基準日価格をウェイトとする加重平均(Laspeyres型)。</li><li>構成銘柄は四半期ごとに見直し、連鎖方式(Chain-linked)で指数の連続性を保つ。</li></ul>
  <h2>3. 平滑化</h2><ul class="plain"><li>公表値は EMA で平滑化し、日次のブレを抑制。</li><li>ランキングは取引件数の少ないカードを除外。</li></ul>
  <h2>4. データ出典</h2><ul class="plain"><li>eBay の落札(Sold)データ。正式版では eBay Marketplace Insights API を利用。</li><li>生データの一括配布は行わず、指数・サマリと eBay へのリンクを提供。</li></ul></div>`;
}

function pageEn(){
  return `<div lang="en">
  <h1>PSA Pokémon Card Index: eBay Sold Prices of Japanese Cards</h1>
  <div class="note" style="margin:8px 0 16px">This is a prototype. All prices, trades and index values shown on the site are randomly generated sample data. The site UI is in Japanese; this page summarizes it in English.</div>
  <h2 style="margin-top:0">What this site is</h2>
  <p>A daily price index for PSA 10 graded Japanese Pokémon cards, based on eBay sold-item prices. It shows an overall index, category indices, and a price chart for each card, with links to eBay.</p>
  <h2>Why we are building it</h2>
  <p>Japanese collectors pay close attention to overseas prices, especially eBay, but many have never visited eBay. No Japanese-language service presents eBay sold-price trends clearly. This site is meant to be a gateway: users come to see what cards actually sold for, then move to eBay. We do not claim it directly increases purchases. A Japanese-language buying guide ("Can I buy on eBay from Japan?") explains how to create an account and make a first purchase, and links to eBay's official how-to-buy page.</p>
  <h2>How the index is built</h2>
  <ul class="plain">
    <li>Card price: rolling 7-day median of sold prices for each card (PSA 10), with outlier removal (MAD). On days without sales, the previous value is carried forward.</li>
    <li>Category index: equal-weight geometric mean of card price ratios (Jevons-type).</li>
    <li>Overall index: weighted by base-date prices (Laspeyres-type). Constituents are reviewed quarterly and chain-linked.</li>
    <li>The published value is smoothed with an EMA to reduce day-to-day volatility. Cards with few recent sales are excluded from the daily gainers/losers rankings.</li>
  </ul>
  <h2>Scope and data</h2>
  <ul class="plain">
    <li>100 cards in two categories (Pokémon cards and Supporter cards). Batch retrieval runs twice a day (00:00 and 12:00 JST).</li>
    <li>Planned data source: eBay Marketplace Insights API. We will not provide bulk downloads of raw data.</li>
    <li>Each card page links to eBay listings. We would like to show the most recent 20 transactions per card, and will follow eBay's instructions on what may be displayed.</li>
    <li>eBay is credited as the source, and the site states that it is unofficial and unaffiliated with eBay.</li>
  </ul>
  <h2>Pages to look at</h2>
  <div class="panel"><ul class="plain">
    <li><a href="#/" lang="ja">Top page</a>: overall index, categories, daily top 10 gainers and losers</li>
    <li><a href="#/category/pokemon" lang="ja">Category page</a>: category index and its card list</li>
    <li><a href="#/card/c023" lang="ja">Card page</a>: price chart, recent transactions with eBay links</li>
    <li><a href="#/guide" lang="ja">Buying guide for Japanese users</a> (Japanese)</li>
    <li><a href="#/about" lang="ja">Methodology</a> (Japanese)</li>
  </ul></div>
  </div>`;
}
