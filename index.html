<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSA ポケカ指数</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1a1d23;--sub:#667085;--line:#e4e7ec;--up:#0a8f4e;--down:#d92d20;--accent:#2f5bea;--raw:#c3cad6;--warn:#fff4d6;--warnink:#7a5200}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#181c24;--ink:#eceff4;--sub:#9aa4b2;--line:#2a303b;--up:#35c47c;--down:#ff6b5e;--accent:#7b9bff;--raw:#3b4452;--warn:#3a2f10;--warnink:#f5d98a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#181c24;--ink:#eceff4;--sub:#9aa4b2;--line:#2a303b;--up:#35c47c;--down:#ff6b5e;--accent:#7b9bff;--raw:#3b4452;--warn:#3a2f10;--warnink:#f5d98a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Hiragino Sans","Yu Gothic",sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header{background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding-block:6px;flex-wrap:wrap;gap:8px 12px}
.logo{font-weight:700;font-size:17px;color:var(--ink)}
nav{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px}
nav a{color:var(--sub);font-size:14px}
nav a.guide{color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:3px 12px;font-weight:600}
.panel{overflow-x:auto}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:12px}
.steps>li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px 14px 52px;position:relative}
.steps>li::before{content:counter(s);position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--bg);font-weight:700;display:grid;place-items:center;font-size:14px}
.steps h3{margin:0 0 4px;font-size:16px}
.note{background:var(--warn);color:var(--warnink);border-radius:10px;padding:10px 14px;font-size:13px;margin-top:12px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px}
.banner{background:var(--warn);color:var(--warnink);font-size:13px;padding:6px 0;text-align:center}
main{padding:20px 0 48px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:28px 0 10px}
.crumb{font-size:13px;color:var(--sub);margin-bottom:8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.hero{display:flex;flex-wrap:wrap;gap:20px;align-items:baseline;margin-bottom:8px}
.big{font-size:40px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chg{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
.meta{font-size:12px;color:var(--sub)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.cat{display:block;color:var(--ink)}.cat:hover{text-decoration:none;border-color:var(--accent)}
.cat .n{font-weight:600}
.two{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media(max-width:720px){.two{grid-template-columns:1fr}.big{font-size:32px}nav a{font-size:13px}}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--sub);font-weight:600}
td.r,th.r{text-align:right}
.btn{display:inline-block;border:1px solid var(--accent);border-radius:8px;padding:2px 10px;font-size:13px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 12px;margin-right:6px;cursor:pointer;font-size:13px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chartbox{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:3px 8px;border-radius:6px;display:none;white-space:nowrap}
.nm{display:flex;align-items:center;gap:10px}
.cimg{border-radius:4px;object-fit:cover;background:var(--line);flex:none}
.cimg.xs,.cbadge.xs{width:28px;height:39px}
.cimg.s,.cbadge.s{width:40px;height:56px}
.cimg.l,.cbadge.l{width:112px;height:157px;border-radius:8px}
.cbadge{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;flex:none;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--sub);line-height:1.15;text-align:center;overflow:hidden}
.cbadge b{font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums}
.cbadge i{font-size:9px;font-style:normal}
.cbadge.l{border-radius:8px}.cbadge.l b{font-size:22px}.cbadge.l i{font-size:13px}
.cbadge.xs b{font-size:9px}.cbadge.xs i{font-size:7px}
.cardhead{display:flex;gap:16px;align-items:flex-start;margin-bottom:6px}
.cardhead h1{margin-top:2px}
.yen{color:var(--sub);font-size:.88em;font-variant-numeric:tabular-nums}
.info{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--sub);color:var(--sub);background:none;font:italic 700 10px/1 Georgia,serif;margin-left:4px;padding:0;cursor:pointer;vertical-align:middle}
.info:hover,.info:focus-visible{color:var(--accent);border-color:var(--accent)}
.pop{position:fixed;z-index:50;max-width:250px;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.6;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.pop[hidden]{display:none}
.pill{display:inline-block;background:var(--warn);color:var(--warnink);border-radius:999px;padding:1px 10px;font-size:12px;margin:2px 0}
.empty{color:var(--sub);font-size:13px;padding:14px 4px}
.flinks{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:8px;font-size:13px}
footer{color:var(--sub);font-size:12px;padding:24px 0;border-top:1px solid var(--line)}
.cta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
ul.plain{padding-left:20px;margin:6px 0}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="#/">PSA ポケカ指数 <span class="meta">JP × eBay</span></a>
  <nav><a href="#/about">指数の算出方法</a><a class="guide" href="#/guide">日本からeBayで買い物できるの？</a></nav>
</div></header>
<div class="banner">試験運用中 — 価格は、eBay の出品情報をもとに、毎日1回算出しています。</div>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap">
  <div class="flinks"><a href="#/source">データの出典</a><a href="#/terms">利用規約・免責</a><a href="#/privacy">プライバシーポリシー</a></div>
  価格データの出典: eBay(出品情報)。本サイトは eBay Inc. とは無関係の非公式サイトです。投資助言ではありません。
</div></footer>

<script src="data/latest.js"></script>
<script>
const GA_ID = 'G-6X43R1P4MT';
const EPN_CAMPID = '5339221531';   // eBay Partner Network campaign ID (affiliate links are off while empty)   // Google Analytics 4 measurement ID (G-XXXXXXXXXX); empty = no analytics
const D = window.PSA_DATA;
if(GA_ID){const g=document.createElement('script');g.async=true;g.src='https://www.googletagmanager.com/gtag/js?id='+GA_ID;document.head.appendChild(g);
  window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};gtag('js',new Date());gtag('config',GA_ID,{send_page_view:false});}
const track=(name,params)=>{if(GA_ID&&window.gtag)gtag('event',name,params)};
const state = {range:0, metric:'index'};
const el = id => document.getElementById(id);
// ---------- helpers ----------
const usd = v => v==null?'—':'$'+v.toLocaleString('en-US',{maximumFractionDigits:2});
const jpy = v => v==null?'—':'¥'+Math.round(v*D.usd_jpy).toLocaleString('ja-JP');
const FXNAME={ecb:'欧州中央銀行(ECB)参照レート',frankfurter:'欧州中央銀行(ECB)参照レート',carried_forward:'前回取得したレート(ECB)',mock:'テスト用レート'};
const fxText=()=>{const [k,d]=(D.usd_jpy_src||'').split(':');return `1ドル = ${D.usd_jpy.toFixed(2)}円<br>出典: ${FXNAME[k]||'為替レート'}${d?`(${d} 公表)`:''}<br>円換算は目安です。`};
const infoBtn='<button type="button" class="info" aria-label="為替の情報">i</button>';
const yenInfo = v => v==null?'':`<span class="yen">(${jpy(v)})</span>${infoBtn}`;
const ud = v => `${usd(v)} ${yenInfo(v)}`;
const pctTxt = r => r==null?'—':`${r>=0?'+':''}${(r*100).toFixed(2)}%`;
const cls = r => r==null?'':(r>=0?'up':'down');
const jst = iso => new Date(iso).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const epn = (url,custom) => EPN_CAMPID ? url+(url.includes('?')?'&':'?')+'mkcid=1&mkrid=711-53200-19255-0&siteid=0&campid='+EPN_CAMPID+'&customid='+encodeURIComponent(custom||'')+'&toolid=10001&mkevt=1' : url;
const relEbay = EPN_CAMPID ? 'sponsored nofollow noopener' : 'noopener';
const ebayUrl = (c,id) => epn('https://www.ebay.com/sch/i.html?_nkw='+encodeURIComponent('PSA 10 '+c.query)+'&LH_BIN=1', id);
if(EPN_CAMPID){const bn=document.querySelector&&document.querySelector('.banner');if(bn)bn.innerHTML+=' ／ <strong>PR</strong> eBay へのリンクには、アフィリエイト広告が含まれます。';}
const FLAG = {anchor:'日本の相場をもとにした参考値(米国の出品が少ないため)', thin:'出品が少ない(日本の相場も加味した参考値)', held:'保留中(急な変動を確認中)', no_data:'データ不足(前日の値を表示)', confirmed_move:'急な変動を確認済み'};
const flagPill = f => FLAG[f]?`<span class="pill">${FLAG[f]}</span>`:'';
const last2 = h => h.length>=2?[h[h.length-2][1],h[h.length-1][1]]:null;
const dod = c => {const l=last2(c.history);return l&&l[0]?l[1]/l[0]-1:null};
const sliceH = a => state.range&&a.length>state.range?a.slice(-state.range):a;

function chart(points, fmt, fine){ // points: [[label, value]]
  if(points.length<2) return `<div class="empty">グラフは、2日分以上のデータがそろってから表示されます。(現在 ${points.length} 日分)</div>`;
  const W=720,H=240,P={l:52,r:10,t:10,b:22},n=points.length,vals=points.map(p=>p[1]);
  const mn=Math.min(...vals),mx=Math.max(...vals),pad=(mx-mn)*0.08||Math.abs(mx)*0.02||1,lo=mn-pad,hi=mx+pad;
  const X=i=>P.l+(W-P.l-P.r)*i/(n-1),Y=v=>P.t+(H-P.t-P.b)*(1-(v-lo)/(hi-lo));
  let g='';
  const tv=[0,1,2,3,4].map(k=>lo+(hi-lo)*k/4);
  let tf=fmt;if(new Set(tv.map(fmt)).size<5)tf=fine||(v=>v.toFixed(2));
  tv.forEach(v=>{const y=Y(v);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P.l-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--sub)">${tf(v)}</text>`});
  [...new Set(n<=3?[...Array(n).keys()]:[0,Math.round((n-1)/2),n-1])].forEach(i=>{g+=`<text x="${X(i)}" y="${H-5}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}" font-size="11" fill="var(--sub)">${points[i][0].slice(5)}</text>`});
  const line=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" points="${points.map((p,i)=>X(i).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>`;
  const id='c'+Math.random().toString(36).slice(2,8);
  setTimeout(()=>{const box=el(id);if(!box)return;const svg=box.querySelector('svg'),tip=box.querySelector('.tip');
    svg.addEventListener('mousemove',e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;const i=Math.max(0,Math.min(n-1,Math.round((x-P.l)/(W-P.l-P.r)*(n-1))));
      tip.style.display='block';tip.style.left=(X(i)/W*r.width+8)+'px';tip.style.top='6px';tip.textContent=`${points[i][0]}  ${fmt(points[i][1])}`});
    svg.addEventListener('mouseleave',()=>tip.style.display='none')},0);
  return `<div class="chartbox" id="${id}"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="推移グラフ">${g}${line}</svg><div class="tip"></div></div>`;
}
function rangeTabs(){return `<div class="tabs" style="margin:6px 0 8px">${[[30,'30日'],[90,'90日'],[0,'全期間']].map(([d,t])=>`<button data-r="${d}" class="${state.range===d?'on':''}">${t}</button>`).join('')}</div>`}
function metricTabs(){return `<div class="tabs" style="margin:6px 0 8px">${[['index','指数'],['mean','平均価格($)'],['price','バスケット価格($)']].map(([m,t])=>`<button data-m="${m}" class="${state.metric===m?'on':''}">${t}</button>`).join('')}</div>`}

function basketBlock(b,note){
  const key=state.metric==='index'?'index':state.metric==='price'?'total_usd':'mean_usd';
  const pts=sliceH(b.history).map(h=>[h.date,h[key]]);
  const ch=b.change;
  const cell=(t,r)=>`<div><div class="meta">${t}</div><div class="chg ${cls(r)}">${pctTxt(r)}</div></div>`;
  return `<div class="panel">
    <div class="hero"><div><div class="meta">指数(基準日 = 100)</div><div class="big">${b.index.toFixed(2)}</div></div></div>
    <div class="hero" style="gap:24px;margin-bottom:4px">${cell('前日比',ch['1d'])}${cell('7日',ch['7d'])}${cell('30日',ch['30d'])}${cell('90日',ch['90d'])}</div>
    <div class="meta">${note||''}</div>
    <div class="meta" style="margin-top:6px">参考(実際の価格): 1枚あたりの平均 ${ud(b.mean_usd)} ／ 中央値 ${ud(b.median_usd)} ／ バスケット価格(${b.n_cards}枚の合計) ${ud(b.total_usd)}</div>
    ${metricTabs()}${b.history.length>30?rangeTabs():''}
    ${chart(pts,state.metric==='index'?v=>v.toFixed(1):v=>'$'+Math.round(v).toLocaleString('en-US'),state.metric==='index'?v=>v.toFixed(3):v=>'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}))}
  </div>`;
}
function thumb(c,size){
  if(c.image) return `<img class="cimg ${size}" src="${c.image}" alt="${c.name_jp}" loading="lazy">`;
  return `<span class="cbadge ${size}"><b>${c.number.split('/')[0]}</b><i>${c.set_code||(c.number.split('/')[1]||'')}</i></span>`;
}
function cardTable(ids){
  const rows=ids.map(id=>[id,D.cards[id]]).sort((a,b)=>(b[1].price_usd||0)-(a[1].price_usd||0));
  return `<table><thead><tr><th>カード</th><th class="r">価格(PSA 10)</th><th class="r">前日比</th><th class="r">使った出品</th></tr></thead><tbody>${rows.map(([id,c])=>`<tr><td><div class="nm">${thumb(c,"s")}<div><a href="#/card/${id}">${c.name_jp}</a> <span class="meta">${c.number}</span> ${flagPill(c.flag)}</div></div></td><td class="r">${ud(c.price_usd)}</td><td class="r ${cls(dod(c))}">${pctTxt(dod(c))}</td><td class="r">${c.n_kept==null?'—':c.n_kept+'件'}</td></tr>`).join('')}</tbody></table>`;
}
function movers(){
  const rows=Object.entries(D.cards).filter(([,c])=>c.flag==='ok'&&dod(c)!=null).map(([id,c])=>[id,c,dod(c)]).sort((a,b)=>b[2]-a[2]);
  if(!rows.length) return `<h2>前日から動いたカード</h2><div class="panel empty">前日比は、2日分のデータがそろった翌日から表示されます。</div>`;
  const t=rows=>`<table><thead><tr><th>カード</th><th class="r">価格</th><th class="r">前日比</th></tr></thead><tbody>${rows.map(([id,c,r])=>`<tr><td><div class="nm">${thumb(c,"xs")}<a href="#/card/${id}">${c.name_jp}</a></div></td><td class="r">${ud(c.price_usd)}</td><td class="r ${cls(r)}">${pctTxt(r)}</td></tr>`).join('')}</tbody></table>`;
  return `<div class="two"><div><h2>前日から上がったカード TOP10</h2><div class="panel">${t(rows.filter(r=>r[2]>0).slice(0,10))}</div></div><div><h2>前日から下がったカード TOP10</h2><div class="panel">${t(rows.filter(r=>r[2]<0).slice(-10).reverse())}</div></div></div>`;
}
function ebayCta(){return `<h2>eBay で実際の出品を確認する</h2><div class="panel cta"><div>本サイトの価格は、eBay の出品情報をもとに毎日1回算出しています。各カードのページから、eBay の出品一覧へ直接移動できます。</div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="#/guide">日本からの買い方ガイド</a><a class="btn" href="${epn('https://www.ebay.com/','cta')}" target="_blank" rel="${relEbay}">eBay を開く ↗</a></div></div>`}

// ---------- pages ----------
function pageTop(){
  const all=D.baskets.find(b=>b.id==='all'),cats=D.baskets.filter(b=>b.id!=='all');
  return `<h1>ポケモンカード(日本語版)PSA10 eBay 価格指数</h1>
  <div class="meta" style="margin-bottom:12px">データ日付 ${D.date} ／ 更新 ${jst(D.generated_at)}(日本時間) ／ 為替 1ドル=${D.usd_jpy.toFixed(2)}円 ／ 対象 ${all.n_cards}銘柄</div>
  ${basketBlock(all,'指数は、各カードの価格の変化を、同じ重みで平均した値です(高額なカードだけに、偏りません)。実際の価格の平均や合計は、参考として併記しています。各カードの価格は、eBay の出品情報をもとに、毎日1回算出しています(算出方法は「指数の算出方法」をご覧ください)。')}
  <h2>カテゴリ</h2>
  <div class="grid">${cats.map(c=>`<a class="panel cat" href="#/category/${c.id}"><div class="n">${c.name}</div><div class="meta">${c.description}</div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:8px"><div><span class="meta">指数</span> <span style="font-size:22px;font-weight:700">${c.index.toFixed(2)}</span> <span class="${cls(c.change['1d'])}">${pctTxt(c.change['1d'])}</span></div><div class="meta">${c.n_cards}枚 ／ 平均 ${usd(c.mean_usd)}</div></div></a>`).join('')}</div>
  ${movers()}
  <div class="meta" style="margin-top:6px">※ ランキングは、通常の値動きのカードだけが対象です(データ不足や保留中のカードは除きます)。</div>
  ${ebayCta()}`;
}
function pageCat(id){
  const b=D.baskets.find(x=>x.id===id);if(!b)return '<p>not found</p>';
  return `<div class="crumb"><a href="#/">TOP</a> › カテゴリ</div><h1>${b.name}</h1><div class="meta" style="margin-bottom:12px">${b.description} ／ ${b.n_cards}銘柄</div>
  ${basketBlock(b,'指数は、カテゴリ内の各カードの価格の変化を、同じ重みで平均した値です。実際の価格の平均や合計は、参考として併記しています。')}
  <h2>対象カード</h2><div class="panel">${cardTable(b.card_ids)}</div>${ebayCta()}`;
}
function pageCard(id){
  const c=D.cards[id];if(!c)return '<p>not found</p>';
  const b=D.baskets.find(x=>x.id!=='all'&&x.card_ids.includes(id));
  const pts=sliceH(c.history).map(h=>[h[0],h[1]]);
  const jp=c.jp_price_jpy!=null?`<div class="panel" style="margin-top:12px"><div class="hero"><div><div class="meta">日本相場(参考:スニーカーダンク)</div><div class="chg">¥${Math.round(c.jp_price_jpy).toLocaleString('ja-JP')}</div><div class="meta">${c.jp_price_age_days}日前に入力</div></div><div><div class="meta">日米プレミアム率</div><div class="chg ${cls(c.premium)}">${pctTxt(c.premium)}</div></div></div><div class="meta">米国価格(円換算)÷ 日本価格 − 1。送料・手数料・関税は含みません。</div></div>`:'';
  return `<div class="crumb"><a href="#/">TOP</a> › ${b?`<a href="#/category/${b.id}">${b.name}</a> › `:''}${c.name_jp}</div>

let route=location.hash.replace(/^#\/?/,'');
function render(){
  const h=route.split('/'),app=el('app');
  if(typeof pop!=='undefined')pop.hidden=true;
  if(!D){app.innerHTML='<div class="panel">データを読み込めませんでした。時間をおいて、再読み込みしてください。</div>';return}
  app.innerHTML=h[0]==='category'?pageCat(h[1]):h[0]==='card'?pageCard(h[1]):h[0]==='about'?pageAbout():h[0]==='guide'?pageGuide():h[0]==='privacy'?pagePrivacy():h[0]==='terms'?pageTerms():h[0]==='source'?pageSource():pageTop();
  window.scrollTo(0,0);
  track('page_view',{page_title:document.title,page_location:location.href.split('#')[0]+'#/'+route,page_path:'/'+route});
}
const pop=document.createElement('div');pop.className='pop';pop.hidden=true;document.body.appendChild(pop);
document.addEventListener('keydown',e=>{if(e.key==='Escape')pop.hidden=true});
document.addEventListener('click',e=>{
  const eb=e.target.closest('a[href*="ebay."]');if(eb)track('ebay_click',{link_url:eb.href,from_page:route});
  const ib=e.target.closest('.info');
  if(ib){e.preventDefault();e.stopPropagation();const show=pop.hidden||pop.dataset.for!==String([...document.querySelectorAll('.info')].indexOf(ib));
    if(!show){pop.hidden=true;return}
    pop.innerHTML=fxText();pop.dataset.for=String([...document.querySelectorAll('.info')].indexOf(ib));pop.hidden=false;
    const r=ib.getBoundingClientRect();pop.style.left=Math.max(8,Math.min(r.left-8,innerWidth-pop.offsetWidth-8))+'px';pop.style.top=(r.bottom+8)+'px';return}
  pop.hidden=true;
  const a=e.target.closest('a[href^="#/"]');
  if(a){e.preventDefault();route=a.getAttribute('href').slice(2);try{history.replaceState(null,'',a.getAttribute('href'))}catch(x){}render();return}
  const b=e.target.closest('.tabs button');
  if(b){if(b.dataset.r!==undefined)state.range=+b.dataset.r;if(b.dataset.m)state.metric=b.dataset.m;const y=scrollY;render();scrollTo(0,y)}
});
window.addEventListener('hashchange',()=>{route=location.hash.replace(/^#\/?/,'');render()});
render();
